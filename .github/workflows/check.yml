name: check

on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify tools.json matches site and live GitHub repos
        run: node scripts/verify-catalog.mjs --check --github
        env:
          GH_TOKEN: ${{ github.token }}
