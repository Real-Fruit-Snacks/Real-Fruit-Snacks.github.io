<!DOCTYPE html>
<!-- The social preview, 1280 x 640, served as assets/og.png (keep that path: the page's og:image points at it).
     Render from the repo root with killer-repo's card.mjs:
       node card.mjs card.html --out assets/og.png
     The headline, and screen-mark's job with the seam just past it, as on the page. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: "Schibsted Grotesk"; font-weight: 400 900; src: url(fonts/schibsted-grotesk-latin-var.woff2) format("woff2"); }
  @font-face { font-family: "Fragment Mono"; font-weight: 400; src: url(fonts/fragment-mono-latin-400.woff2) format("woff2"); }
  html, body { margin: 0; width: 1280px; height: 640px; background: #0C0D10; color: #E8E6E1; overflow: hidden; }
  body { box-sizing: border-box; padding: 60px 80px 64px; display: flex; flex-direction: column; font-family: "Schibsted Grotesk", sans-serif; }
  .mark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .mark i { width: 4px; height: 32px; background: #FF6A3D; box-shadow: 0 0 12px rgb(255 106 61 / .7); }
  h1 { margin: 30px 0 0 -6px; font-weight: 800; font-size: 120px; line-height: .9; letter-spacing: -0.045em; }
  .job { margin-top: auto; display: grid; grid-template-columns: 84px auto; align-items: baseline; row-gap: 10px; width: fit-content; position: relative; padding-right: 30px; }
  .k { font-weight: 700; font-size: 17px; letter-spacing: .14em; }
  .in { color: #FFC247; } .out { color: #3DDC97; }
  code { font-family: "Fragment Mono", monospace; font-size: 40px; letter-spacing: -0.015em; }
  .v-in { color: #8A8F99; } .v-out { color: #E8E6E1; }
  .seam { position: absolute; right: 0; top: -6px; bottom: -4px; width: 4px; background: #FF6A3D; box-shadow: 0 0 20px rgb(255 106 61 / .75); }
</style>
</head>
<body>
  <p class="mark">Real-Fruit-Snacks<i></i></p>
  <h1>Small tools,<br>one job each.</h1>
  <div class="job">
    <span class="k in">IN</span><code class="v-in">Ctrl+PrintScreen</code>
    <span class="k out">OUT</span><code class="v-out">screen-mark_2026-11-05_091412.png</code>
    <i class="seam"></i>
  </div>
</body>
</html>
